<title>小吊球，大杀球</title><link rel="stylesheet" href="../fonts/fonts.css"><style>
/* 字体、颜色和书一致（产品负责人 11-17 第 2 稿意见 1、2）：只用 Noto Sans SC；米白底、深灰字；主按钮蓝、次要按钮浅蓝；局面格照书上的颜色 */
:root{--bg:#FFFDF7;--ink:#2B2B2B;--card:#FFFFFF;--blue:#2F7FD9;--sec:#E7EEF8;--gold:#F2B01E;--red:#E0301E;--line:#DDD;--court:#EAF6EE;
  --u:1px;--pad:14px;--gap:10px;--r:14px;--btn:52px;--fs:17px;--say:18px;--side:96px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{overflow:hidden}
#app{height:100vh;height:100dvh;padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right));
  padding-bottom:max(var(--pad),env(safe-area-inset-bottom));display:grid;gap:var(--gap);min-height:0}
button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.35em;height:var(--btn);padding:0 .9em;border:0;border-radius:var(--r);
  background:var(--sec);color:var(--blue);font-size:var(--fs);font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .08s,filter .08s,background .2s;white-space:nowrap}
.b:active:not(:disabled){transform:translateY(2px) scale(.96);filter:brightness(.88);box-shadow:none}
.b:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none}
.b svg{font-size:1.15em;flex:none}
.chip{display:inline-flex;align-items:center;gap:.3em;height:calc(var(--btn)*.72);padding:0 .9em;border:0;border-radius:999px;background:var(--sec);color:var(--blue);
  font-size:calc(var(--fs)*.82);font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.chip:active{transform:translateY(2px);box-shadow:none} #view{background:var(--blue);color:#fff}   /* 换视图和书上「3D」按钮一样是蓝底白字 */
span.chip{background:rgba(255,255,255,.9);color:#555;box-shadow:none}   /* 拖一拖提示不是按钮，白底灰字 */
/* 顶栏：返回、页码、标题、换视图（转一转只在立体时、平板上放这里） */
#top{grid-area:top;display:flex;align-items:center;gap:calc(var(--gap)*1.2);min-width:0}
#back{width:var(--btn);height:var(--btn);padding:0;border-radius:50%;flex:none}
#no{flex:none;height:calc(var(--btn)*.8);display:flex;align-items:center;padding:0 .55em;border-radius:10px;background:var(--blue);color:#fff;

h1{margin:0;flex:1;min-width:0;font-size:calc(var(--fs)*1.45);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spin{display:none} html.is3d.pad #spin{display:inline-flex}
/* 球场：只等比缩放、居中；横屏左右摆、竖屏上下摆 */
#court{grid-area:court;position:relative;min-height:0;min-width:0}
#court>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#court{background:var(--court);border-radius:var(--r)}   /* 球场底：书上球场图的浅绿底 */
#v3{display:none;touch-action:none;cursor:grab;background:var(--court);border-radius:var(--r)}
#c2{transition:opacity .2s}
#chips{position:absolute;left:10px;right:10px;top:10px;display:none;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
html.is3d #chips{display:flex} #chips>*{pointer-events:auto} #chips .r{display:flex;gap:6px;margin-left:auto}
#hint{position:absolute;left:10px;top:10px;z-index:2;display:none;font-weight:700} html.is3d #hint{display:inline-flex} html.is3d #hint[hidden]{display:none}
html.phone #hint{top:auto;bottom:10px}   /* 手机上右上角放转一转、回到正面，提示挪到下面 */
#spin2{display:none} html.is3d.phone #spin2{display:inline-flex}
.badge{position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;transition:all .3s;background:var(--red);color:#fff;font-weight:900;
  font-size:var(--fs);padding:4px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:3;pointer-events:none;white-space:nowrap}
.badge.on{opacity:1;transform:translateX(-50%) scale(1)} html.is3d .badge{top:auto;bottom:10px}
/* 局面：小标签，颜色照书（灰 = 没到，浅绿 = 走过的，金 = 目标格），放完一拍点亮 */
#lv{grid-area:lv;display:flex;align-items:center;gap:6px;min-width:0}
#lv .h{font-size:calc(var(--fs)*.72);font-weight:900;flex:none}
#lv .t{display:flex;gap:6px;min-width:0} .tag{padding:3px 10px;border-radius:999px;background:#EEE;color:#999;font-size:calc(var(--fs)*.76);font-weight:700;white-space:nowrap;text-align:center;
  transition:all .3s}
.tag.on{background:#CFE8D8;color:#1E6B45} .tag.goal{background:#F2B01E;color:#5A3D00}   /* 书（v2.py .pill）同一套 */
/* 讲解：小标题、拍数圆点（当前这拍黄）、右上角小喇叭 */
#talk{grid-area:talk;position:relative;background:var(--card);border:2px solid var(--line);border-radius:calc(var(--r)*1.15);padding:10px 14px 12px;min-width:0;align-self:start}
#talk .hd{display:flex;align-items:center;gap:6px;height:calc(var(--btn)*.62);padding-right:calc(var(--btn)*.75)}
#tl{font-size:calc(var(--fs)*.78);font-weight:700;color:#B07800;margin-right:4px;white-space:nowrap} #tl.warn{color:var(--red)} #tl.end{color:#1E6B45}
.dot{width:calc(var(--fs)*1.45);height:calc(var(--fs)*1.45);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--fs)*.78);
  font-weight:700;background:#EEE;color:#999;flex:none;transition:background .2s}
.dot.done{background:var(--sec);color:var(--blue)} .dot.cur{background:var(--gold);color:#5A3D00}
#say{margin:4px 0 0;font-size:var(--say);line-height:1.45;font-weight:700;overflow:hidden}
#say b{color:#F07A2A}
#spk{position:absolute;right:10px;top:8px;width:calc(var(--btn)*.72);height:calc(var(--btn)*.72);border-radius:50%;border:0;background:var(--sec);color:var(--blue);
  display:grid;place-items:center;font-size:calc(var(--fs)*1.05);padding:0;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#vpop{position:absolute;right:8px;top:calc(var(--btn)*.72 + 14px);z-index:5;width:max-content;min-width:230px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);box-shadow:0 3px 10px rgba(0,0,0,.15);padding:10px 14px;display:grid;gap:10px;font-size:var(--fs);font-weight:700}
#vpop[hidden]{display:none} html.pl #vpop,html.hl #vpop{top:auto;bottom:calc(100% - 4px)}   /* 讲解条在下面时往上开，不被屏幕底边切掉 */ #vpop .row{display:flex;align-items:center;justify-content:space-between;gap:16px}
#vpop small{display:block;font-size:.72em;color:#777;font-weight:700}
#voice{width:56px;height:32px;border-radius:999px;border:0;background:#DDD;position:relative;padding:0;flex:none}
#voice::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
#voice[aria-checked=true]{background:var(--blue)} #voice[aria-checked=true]::after{left:27px}
#vnext{height:34px;font-size:calc(var(--fs)*.8)} #vnote{font-size:12px;font-weight:700;color:#777} #vnote:empty{display:none}
/* 播放那一组：播放最大、蓝底白字；下一拍 / 重来 / 看打错的浅蓝底（书上动画页的主 / 次按钮） */
#ctrl{grid-area:ctrl;display:flex;gap:calc(var(--gap)*1.1);align-items:stretch}
#play{background:var(--blue);color:#fff;font-size:calc(var(--fs)*1.35);font-weight:900;height:auto;min-height:calc(var(--btn)*1.5)}

html.pl #app{grid-template:"top top" auto "court court" minmax(0,1fr) "lv lv" auto "talk ctrl" auto / minmax(0,1fr) auto}

/* ---- 竖屏（平板 / 手机）：讲解在上，球场左边，右栏上面局面、下面播放组（播放在最下） ---- */
html.pp #app,html.hp #app{grid-template:"top top" auto "talk talk" auto "court side" minmax(0,1fr) / minmax(0,1fr) var(--side)}

/* ---- 手机竖屏 · 底部一排（hb，产品负责人 11-17「按建议」）：讲解在上，球场用满剩下的高度，局面放进球场顶上的 1 米留边，
   按钮在最下面排一排：看打错的、重来、下一拍、播放（最宽、在右手拇指的位置）。和右栏摆法（hp）哪种球场大用哪种，见 layout() ---- */
html.hb #app{grid-template:"top" auto "talk" auto "court" minmax(0,1fr) "ctrl" auto / minmax(0,1fr)}
html.hb #side{display:contents}
html.hb #lv{grid-area:court;align-self:start;justify-self:center;position:relative;z-index:2;pointer-events:none;margin-top:var(--lvtop,8px)}
html.hb #lv .h{display:none} html.hb #lv .t{gap:4px} html.hb .tag{font-size:var(--tagfs,11px);padding:2px 7px}
html.hb #ctrl{flex-direction:row;gap:8px}
html.hb #ctrl .b:not(#play){flex:1 1 0;min-width:0;flex-direction:column;gap:1px;height:auto;min-height:calc(var(--btn)*1.2);padding:4px 2px;font-size:calc(var(--fs)*.8);line-height:1.15}
html.hb #wbtn{order:0} html.hb #reset{order:1} html.hb #next{order:2} html.hb #play{order:3;flex:1.9 1 0;min-width:0;min-height:calc(var(--btn)*1.2);font-size:calc(var(--fs)*1.2);gap:.3em;padding:0 .5em}
html.hb .badge{top:auto;bottom:10px}
html.hb.is3d #chips{top:auto;bottom:10px}   /* 立体：局面浮在画框上沿（镜头会转，留边跟着动，放不稳），转一转、回到正面挪到下面 */
/* ---- 手机横屏：左边顶栏 + 球场，右栏局面、讲解（四行）、播放、三个小钮 ---- */
html.hl #app{grid-template:"top lv" auto "court talk" minmax(0,1fr) "court ctrl" auto / minmax(0,1fr) var(--side)}
html.hl #lv .h{display:none} html.hl #lv .t{width:100%;gap:4px} html.hl .tag{flex:1 1 auto;padding:3px 4px;font-size:10.5px}   /* 格和格之间留空，不挤成一格（trishot 11-16） */
html.hl #talk{align-self:stretch}
html.hl #ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} html.hl #play{grid-column:1/-1;order:-1;min-height:calc(var(--btn)*1.15)}
html.hl #ctrl .b:not(#play){font-size:calc(var(--fs)*.8);padding:0 2px;height:var(--btn)}
/* 尺寸：平板大、手机小 */
html.pl,html.pp{--pad:20px;--gap:12px;--btn:54px;--fs:19px;--say:21px;--side:120px}
html.pp{--side:124px}
html.hp{--pad:12px;--gap:8px;--btn:44px;--fs:15px;--say:16px;--side:74px;--r:12px}
html.hb{--pad:12px;--gap:8px;--btn:44px;--fs:15px;--say:16px;--r:12px}
html.hl{--pad:10px;--gap:8px;--btn:40px;--fs:14px;--say:15px;--side:230px;--r:12px}
html.hp #lv .h{font-size:11px} html.hp .tag{font-size:11px;padding:3px 0}
html.hp h1,html.hb h1{font-size:calc(var(--fs)*1.25)} html.hp #no,html.hb #no{font-size:calc(var(--fs)*1.15)}
html.hl h1{font-size:calc(var(--fs)*1.3)}
#mz{position:absolute;visibility:hidden;left:-9999px;top:0}
/* 全屏打开时让开状态栏、底部横条（R-120 11-18）：单独打开这页时自己让；放在网页版弹框（iframe）里时由外框四边让，这里不再让，免得有的浏览器把 inset 也给 iframe、让两遍 */
html.framed #app{padding:var(--pad)}

window.__v3={prof,line,ghost,full,dragFit,dragAt,reset:()=>{ for(const o of [samples,fulls,profs,ghosts]) for(const k in o) delete o[k]; }};   // reset：测试改了 V3.lines 以后重算   // 测试用：tests/test_book_v2.py 查每条线过网够不够高
function z3(i,u){ const p=prof(i), x=Math.min(40,Math.max(0,u*40)), k=Math.floor(x); return k>=40?p[40]:p[k]+(p[k+1]-p[k])*(x-k); }
function cam(){ const cp=Math.cos(pitch); return {C:[Math.sin(yaw)*cp*dist, Math.cos(yaw)*cp*dist, 0.6+Math.sin(pitch)*dist], T:[0,0,0.6]}; }
let K=null;
function setup(){ const {C,T}=cam(); const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], nm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l);};
  const f=nm(sub(T,C)), r=nm(cr([0,0,1],f)), u=cr(f,r); K={C,f,r,u,sub,dot}; }   // 右 = 上 × 前；反过来乘左右镜像（2026-11-03 修）
function P(x,y,z){ const {C,f,r,u,sub,dot}=K, d=sub([x,y,z||0],C), zc=dot(d,f); if(zc<0.3) return null;
  const s=FIT.k/zc; return {x:FIT.ox+dot(d,r)*s, y:FIT.oy-dot(d,u)*s, s}; }
const el=(t,a,p)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; };
// 地上的圈 / 影子按真的地面圆投影（试用者 2026-11-07：顶视角时落点的圈画得不对——以前是屏幕上固定扁的椭圆，从上往下看也是扁的）
function gcirc(x,y,r,a){ const q=[]; for(let k=0;k<24;k++){ const t=k/24*2*Math.PI, p=P(x+r*Math.cos(t), y+r*Math.sin(t), 0); if(!p) return; q.push(p); } el("polygon",Object.assign({points:pts(q)},a)); }
const pts=a=>a.filter(Boolean).map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
function seg(x0,y0,x1,y1,w,col,op,dash){ const a=P(x0,y0,0), b=P(x1,y1,0); if(a&&b) el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col||"#fff","stroke-width":w,opacity:op||.9,"stroke-dasharray":dash||"","stroke-linecap":"round"}); }
function quad(x0,y0,x1,y1,fill){ const q=[P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)]; if(q.every(Boolean)) el("polygon",{points:pts(q),fill}); }
// 小人按真人 1.6 米、离镜头多远来缩放（f.s = 这一点每米多少像素），不按「竖着的 1.6 米在屏幕上投影多长」：
// 那样从正上方看时投影几乎为零，小人只剩最小值那么点（试用者 2026-11-06：Top 视图小人太小）
function person(px,py,col,lab,top){ const [x,y]=m(px,py), f=P(x,y,0); if(!f) return;
  const H=Math.max(14,1.6*f.s), w=H*.42;
  gcirc(x,y,.4,{fill:"rgba(0,0,0,.25)"});
  el("rect",{x:f.x-w/2,y:f.y-H*.75,width:w,height:H*.62,rx:w*.4,fill:col});
  el("circle",{cx:f.x,cy:f.y-H*.88,r:H*.17,fill:"#FFE0BD",stroke:"#3a2a1a","stroke-width":1});
  const t=el("text",{x:f.x,y:f.y-H*.4,"text-anchor":"middle","font-size":Math.max(9,H*.24),"font-weight":800,fill:"#fff"}); t.textContent=lab;
  if(top){ const b=el("text",{x:f.x,y:f.y-H*1.15,"text-anchor":"middle","font-size":14,"font-weight":800,fill:"#2B2B2B",stroke:"#fff","stroke-width":4,"paint-order":"stroke"}); b.textContent=top; } }
function draw(){
  setup(); svg.innerHTML="";
  quad(-DW-1,-D-1,DW+1,D+1,"#3F9A70"); quad(-DW,-D,DW,D,"#52B788");
  // 单打的线粗、双打多出来的那条边上的线细（试用者 2026-11-05：底线两端双打那段该是细线）
  for(const s of [-1,1]){ seg(-W,s*D,W,s*D,2.5); seg(-W,s*SS,W,s*SS,2.5); for(const e of [-1,1]){ seg(e*W,s*D,e*DW,s*D,1.2,"#fff",.6); seg(e*W,s*SS,e*DW,s*SS,1.2,"#fff",.6); }
    seg(-DW,s*LS,DW,s*LS,1.2,"#fff",.6); seg(0,s*SS,0,s*D,2.5); seg(s*W,-D,s*W,D,2.5); seg(s*DW,-D,s*DW,D,1.2,"#fff",.6); }
  brand3d();
  // 球网和球路闯关同一种画法（试用者 2026-11-08）：两根网柱立在双打边线上、高 1.55 米；网中间 1.524 米、往两边略高（网带下垂）；
  // 网身 76 厘米高、下面是空的；黑色细网格半透明，白色网带；地上一道淡影。网跟人、球按远近一起画，网后面的会被网挡一点
  { const s=[P(-DW,.25,0),P(DW,.25,0),P(DW,.05,0),P(-DW,.05,0)]; if(s.every(Boolean)) el("polygon",{points:pts(s),fill:"rgba(0,0,0,.12)"}); }
  const netTop=x=>1.524+0.026*(x/DW)**2;
  const net=()=>{ const N=24, xs=Array.from({length:N+1},(_,i)=>-DW+2*DW*i/N);
    const top=xs.map(x=>P(x,0,netTop(x))), bot=xs.map(x=>P(x,0,netTop(x)-.76)), tape=xs.map(x=>P(x,0,netTop(x)-.075)); if(![...top,...bot].every(Boolean)) return;
    el("polygon",{points:pts([...top,...bot.slice().reverse()]),fill:"rgba(18,20,22,.2)"});   // 网身：淡一点，代替画不出来的细网线（真网 2 厘米一格，隔远看是一层暗纱）
    const mesh=[], f1=q=>q.x.toFixed(1)+" "+q.y.toFixed(1);
    for(let x=-DW;x<=DW+1e-6;x+=.06){ const a=P(x,0,netTop(x)), b=P(x,0,netTop(x)-.76); if(a&&b) mesh.push("M"+f1(a)+"L"+f1(b)); }
    for(let d=.06;d<.76;d+=.06) mesh.push("M"+xs.map(x=>f1(P(x,0,netTop(x)-d))).join("L"));
    el("path",{d:mesh.join(""),fill:"none",stroke:"rgba(16,18,20,.42)","stroke-width":.5});   // 网格：真网的线是黑的；6 厘米一格（试用者 2026-11-09：12 厘米太稀，看着球能穿过去）
    el("polyline",{points:pts(bot),fill:"none",stroke:"rgba(230,235,240,.55)","stroke-width":1.2});   // 下沿绳
    el("polygon",{points:pts([...top,...tape.slice().reverse()]),fill:"#f4f4f2",stroke:"#d8d8d4","stroke-width":.6});   // 白色网带
    for(const sx of [-1,1]){ const x=sx*(DW+.02), a=P(x,0,0), b=P(x,0,1.55); if(!a||!b) continue; const w=Math.max(2.5,.045*a.s);   // 网柱
      el("ellipse",{cx:a.x,cy:a.y,rx:w*2.2,ry:w*.9,fill:"rgba(0,0,0,.3)"});
      el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#4a5058","stroke-width":w,"stroke-linecap":"round"});
      el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"rgba(255,255,255,.35)","stroke-width":w*.35});
      el("circle",{cx:b.x,cy:b.y,r:w*.75,fill:"#e8e8e8"}); } };
  const behindNet=K.C[1]<0;   // 镜头在对方那边：网要画在我方的东西后面
  // 人、球：按离镜头远近排，远的先画；网夹在两边中间
  const items=[];
  for(const w of ["op","me"]) if(POS[w]){ const [x,y]=m(...POS[w]); const bub=Object.entries(V3.bubs).find(([id,b])=>b[0]===w&&$(id)&&+getComputedStyle($(id)).opacity>.5);
    items.push({y, fn:()=>person(POS[w][0],POS[w][1],w==="me"?"#F07A2A":"#2F7FD9",w==="me"?"我":"对手",bub?bub[1][1]:null)}); }
  // 线：露出来的整条画，正在飞的画到球那里；地上画一道影子
  let ball=null;
  for(let i=0;i<V3.lines.length;i++){ const s=$("s"+i); if(!s) continue; const vis=s.style.visibility==="visible"; if(!vis&&!(CUR&&CUR.i===i)) continue;
    const L=line(i), H=V3.lines[i], end=CUR&&CUR.i===i?CUR.e:1, n=Math.max(1,Math.round(40*end)), op=+getComputedStyle(s.parentNode).opacity||1;
    const sh=[], air=[]; for(let k=0;k<=n;k++){ const u=k/40; sh.push(P(L[k][0],L[k][1],0)); air.push(P(L[k][0],L[k][1],z3(i,u))); }
    el("polyline",{points:pts(sh),fill:"none",stroke:"rgba(0,0,0,.22)","stroke-width":3,opacity:op});
    el("polyline",{points:pts(air),fill:"none",stroke:s.getAttribute("stroke"),"stroke-width":+s.getAttribute("stroke-width")*.8,"stroke-dasharray":s.getAttribute("stroke-dasharray")||"","stroke-linecap":"round",opacity:op});
    // 接上下一拍（connect_hits）时：线停在下一拍的击球点，后面用灰色细虚线画出「没人接会落在哪」（试用者 2026-11-06）
    if(H.z1>0&&end>=1){ const g=ghost(i); if(g.length>1){ el("polyline",{points:pts(g.map(q=>P(q[0],q[1],q[2]))),fill:"none",stroke:"#8a8f8c","stroke-width":2,"stroke-dasharray":"4 5",opacity:.7*op});
      const e=g[g.length-1], c=P(e[0],e[1],0); if(c) gcirc(e[0],e[1],.22,{fill:"none",stroke:"#8a8f8c","stroke-width":1.5,opacity:.8*op}); } }
    if(CUR&&CUR.i===i){ const k=Math.min(40,Math.round(40*CUR.e)); ball={x:L[k][0],y:L[k][1],z:z3(i,CUR.e)}; } }
  // 错误打法的红叉
  V3.x.forEach((p,j)=>{ if(!p||!$("x"+j)||$("x"+j).style.opacity!=="1") return; const [x,y]=m(...p), c=P(x,y,0); if(!c) return;
    const r=Math.max(6,c.s*.25); el("path",{d:`M${c.x-r} ${c.y-r*.5} L${c.x+r} ${c.y+r*.5} M${c.x+r} ${c.y-r*.5} L${c.x-r} ${c.y+r*.5}`,stroke:"#E0301E","stroke-width":5,"stroke-linecap":"round"}); });
  items.push({y:0, fn:net, net:true});
  if(ball) items.push({y:ball.y, fn:()=>{ const g=P(ball.x,ball.y,0), b=P(ball.x,ball.y,ball.z); if(g&&b){ gcirc(ball.x,ball.y,.1,{fill:"rgba(0,0,0,.35)"});
    el("circle",{cx:b.x,cy:b.y,r:Math.max(3.5,b.s*.09),fill:"#fff",stroke:"#555","stroke-width":1.2}); } }});   // 球也按远近：在网后面就隔着网看
  items.sort((a,b)=>behindNet ? b.y-a.y : a.y-b.y);   // 远的先画
  for(const it of items) it.fn();
  raf=on?requestAnimationFrame(draw):0; }

let FIT={k:560,ox:220,oy:300}, spinning=0;
// 产品名「想三拍」画在地上（两条底线外 1 米留边的正中，字高约 0.45 米），跟着球场一起转；每一端的字从那一端往网的方向读。离得太远、字小到看不清就不画
function brand3d(){ for(const s of [-1,1]){ const cy=s*(D+.5), o=P(0,cy,0), a=P(s,cy,0), b=P(0,cy-s,0); if(!o||!a||!b) continue;
  if(Math.min(Math.hypot(a.x-o.x,a.y-o.y),Math.hypot(b.x-o.x,b.y-o.y))*.45<9) continue;   // 远端的字在地上被压扁：按压扁以后的字高算，不到 9 像素认不出就不画（trishot 核第 4 稿：手机竖屏远端缩成一小团）
  const t=el("text",{transform:`matrix(${((a.x-o.x)/100).toFixed(4)} ${((a.y-o.y)/100).toFixed(4)} ${((o.x-b.x)/100).toFixed(4)} ${((o.y-b.y)/100).toFixed(4)} ${o.x.toFixed(1)} ${o.y.toFixed(1)})`,
    "font-size":45,"text-anchor":"middle","dominant-baseline":"central","letter-spacing":14,fill:"#fff",opacity:.3,"font-weight":900}); t.textContent="想三拍"; } }
const yaw0=()=>LAND?Math.PI/2:0;   // 横屏从侧面看（我在左）、竖屏从我身后看
function fit(){ const r=svg.getBoundingClientRect(), W=Math.max(50,r.width), H=Math.max(50,r.height); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const keep=FIT; FIT={k:1,ox:0,oy:0}; setup(); const q=[];
  for(const x of [-DW-1,DW+1]) for(const y of [-D-1,D+1]) q.push(P(x,y,0));
  for(const y of [-4,-2,0,2,4]) q.push(P(0,y,6.5)); for(const x of [-DW,DW]) q.push(P(x,0,1.6));
  const g=q.filter(Boolean); if(!g.length){ FIT=keep; return; }
  const x0=Math.min(...g.map(p=>p.x)), x1=Math.max(...g.map(p=>p.x)), y0=Math.min(...g.map(p=>p.y)), y1=Math.max(...g.map(p=>p.y)), pad=Math.min(W,H)*.04;
  const k=Math.min((W-2*pad)/(x1-x0),(H-2*pad)/(y1-y0)); FIT={k, ox:W/2-(x0+x1)/2*k, oy:H/2-(y0+y1)/2*k}; }
function home(){ yaw=yaw0(); pitch=.6; dist=15; fit(); }
function show(v,save){ on=v; if(save) try{ localStorage.setItem(VIEW_KEY,on?"3d":"2d"); }catch(e){}   // 只记读者自己点的（进页面时那一次不记）
  document.documentElement.classList.toggle("is3d",on); svg.style.display=on?"block":"none"; $("c2").style.opacity=on?0:1; sizeLabels();
  $("view").textContent=on?"看平面":"看立体"; spinning=0; cancelAnimationFrame(raf); if(on){ home(); draw(); } }
let hinted=false; try{ hinted=localStorage.getItem("book_3d_hint")==="done"; }catch(e){}
function dragged(){ if(hinted) return; hinted=true; try{ localStorage.setItem("book_3d_hint","done"); }catch(e){} $("hint").hidden=true; }
$("hint").hidden=hinted;
$("view").onclick=()=>show(!on,true); $("home").onclick=()=>{ spinning=0; home(); };
for(const id of ["spin","spin2"]) $(id).onclick=()=>{ const t0=performance.now(), y0=yaw; spinning=t0;   // 转一转：慢慢转一整圈，回到原来的角度
  const step=t=>{ if(spinning!==t0) return; const f=Math.min(1,(t-t0)/4500); yaw=y0+2*Math.PI*(f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2); if(f<1) requestAnimationFrame(step); else spinning=0; };
  requestAnimationFrame(step); };
let lastLand=LAND; window.addEventListener("layout",()=>{ if(LAND!==lastLand){ lastLand=LAND; yaw=yaw0(); pitch=.6; } if(on) fit(); });   // 横竖一换回到默认角度；别的大小变化只重新放进画框

const ptrs=new Map(); let pinch=0;
svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]); spinning=0; dragged(); });
svg.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId); if(!p) return;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d0=Math.hypot(a[0]-b[0],a[1]-b[1]); ptrs.set(e.pointerId,[e.clientX,e.clientY]); const [c,d]=[...ptrs.values()], d1=Math.hypot(c[0]-d[0],c[1]-d[1]);
    if(d0>0) dist=Math.min(34,Math.max(8,dist*d0/d1)); return; }
  yaw-=(e.clientX-p[0])*.008; pitch=Math.min(1.5,Math.max(.08,pitch+(e.clientY-p[1])*.006)); ptrs.set(e.pointerId,[e.clientX,e.clientY]); });
for(const t of ["pointerup","pointercancel"]) svg.addEventListener(t,e=>ptrs.delete(e.pointerId));
svg.addEventListener("wheel",e=>{ e.preventDefault(); dist=Math.min(34,Math.max(8,dist*(1+e.deltaY*.001))); },{passive:false});
show(on);
})();
</script></body></html>
