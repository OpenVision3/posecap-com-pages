<title>截杀：不等球落，抢高点</title><link rel="stylesheet" href="../fonts/fonts.css"><style>

  padding-bottom:max(var(--pad),env(safe-area-inset-bottom));display:grid;gap:var(--gap);min-height:0}

.b svg{font-size:1.15em;flex:none}
.chip{display:inline-flex;align-items:center;gap:.3em;height:calc(var(--btn)*.72);padding:0 .9em;border:0;border-radius:999px;background:var(--sec);color:var(--blue);

.chip:active{transform:translateY(2px);box-shadow:none} #view{background:var(--blue);color:#fff}   /* 换视图和书上「3D」按钮一样是蓝底白字 */

#vpop{position:absolute;right:8px;top:calc(var(--btn)*.72 + 14px);z-index:5;width:max-content;min-width:230px;background:var(--card);border:2px solid var(--line);

html.hl #app{grid-template:"top lv" auto "court talk" minmax(0,1fr) "court ctrl" auto / minmax(0,1fr) var(--side)}

html.pl,html.pp{--pad:20px;--gap:12px;--btn:54px;--fs:19px;--say:21px;--side:120px}

/* 手机竖屏有两种摆法：右栏（hp）和底部一排（hb）。各摆一次、量球场能放多大，哪种大用哪种（产品负责人 11-17「按建议」）：

/* ---------- 动画（照第 2 版）：人换表情、走位，线用遮罩一点点露出来，球沿线飞 ---------- */
function setMood(who,m){ const el=$(who); if(!el) return; for(const g of el.querySelectorAll(".mood")) g.style.display=g.dataset.mood===m?"inline":"none"; }
