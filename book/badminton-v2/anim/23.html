  const H=Math.max(14,1.6*f.s), w=H*.42;
  el("ellipse",{cx:f.x,cy:f.y,rx:w*.8,ry:w*.28,fill:"rgba(0,0,0,.25)"});
  el("rect",{x:f.x-w/2,y:f.y-H*.75,width:w,height:H*.62,rx:w*.4,fill:col});
  el("circle",{cx:f.x,cy:f.y-H*.88,r:H*.17,fill:"#FFE0BD",stroke:"#3a2a1a","stroke-width":1});
  const t=el("text",{x:f.x,y:f.y-H*.4,"text-anchor":"middle","font-size":Math.max(9,H*.24),"font-weight":800,fill:"#fff"}); t.textContent=lab;
  if(top){ const b=el("text",{x:f.x,y:f.y-H*1.15,"text-anchor":"middle","font-size":14,"font-weight":800,fill:"#2B2B2B",stroke:"#fff","stroke-width":4,"paint-order":"stroke"}); b.textContent=top; } }
function draw(){
  setup(); svg.innerHTML="";
  quad(-DW-.5,-D-.5,DW+.5,D+.5,"#3F9A70"); quad(-DW,-D,DW,D,"#52B788");
  // 单打的线粗、双打多出来的那条边上的线细（试用者 2026-11-05：底线两端双打那段该是细线）
  for(const s of [-1,1]){ seg(-W,s*D,W,s*D,2.5); seg(-W,s*SS,W,s*SS,2.5); for(const e of [-1,1]){ seg(e*W,s*D,e*DW,s*D,1.2,"#fff",.6); seg(e*W,s*SS,e*DW,s*SS,1.2,"#fff",.6); }
    seg(-DW,s*LS,DW,s*LS,1.2,"#fff",.6); seg(0,s*SS,0,s*D,2.5); seg(s*W,-D,s*W,D,2.5); seg(s*DW,-D,s*DW,D,1.2,"#fff",.6); }
  const n0=P(-DW-.1,0,0), n1=P(DW+.1,0,0), t0=P(-DW-.1,0,NETH), t1=P(DW+.1,0,NETH);
  const net=()=>{ if(n0&&n1&&t0&&t1){ el("polygon",{points:pts([n0,n1,t1,t0]),fill:"rgba(30,30,30,.35)"}); el("line",{x1:t0.x,y1:t0.y,x2:t1.x,y2:t1.y,stroke:"#eee","stroke-width":2.5}); } };
  const behindNet=K.C[1]<0;   // 镜头在对方那边：网要画在我方的东西后面
  // 人：按离镜头远近排，远的先画；网夹在两边中间
  const items=[];
  for(const w of ["op","me"]) if(POS[w]){ const [x,y]=m(...POS[w]); const bub=Object.entries(V3.bubs).find(([id,b])=>b[0]===w&&$(id)&&+getComputedStyle($(id)).opacity>.5);
    items.push({y, fn:()=>person(POS[w][0],POS[w][1],w==="me"?"#F07A2A":"#2F7FD9",w==="me"?"我":"对手",bub?bub[1][1]:null)}); }
  // 线：露出来的整条画，正在飞的画到球那里；地上画一道影子
  let ball=null;
  for(let i=0;i<V3.lines.length;i++){ const s=$("s"+i); if(!s) continue; const vis=s.style.visibility==="visible"; if(!vis&&!(CUR&&CUR.i===i)) continue;
    const L=line(i), H=V3.lines[i], end=CUR&&CUR.i===i?CUR.e:1, n=Math.max(1,Math.round(40*end)), op=+getComputedStyle(s.parentNode).opacity||1;
    const sh=[], air=[]; for(let k=0;k<=n;k++){ const u=k/40; sh.push(P(L[k][0],L[k][1],0)); air.push(P(L[k][0],L[k][1],z3(i,u))); }
    el("polyline",{points:pts(sh),fill:"none",stroke:"rgba(0,0,0,.22)","stroke-width":3,opacity:op});
    el("polyline",{points:pts(air),fill:"none",stroke:s.getAttribute("stroke"),"stroke-width":+s.getAttribute("stroke-width")*.8,"stroke-dasharray":s.getAttribute("stroke-dasharray")||"","stroke-linecap":"round",opacity:op});
    // 接上下一拍（connect_hits）时：线停在下一拍的击球点，后面用灰色细虚线画出「没人接会落在哪」（试用者 2026-11-06）
    if(H.z1>0&&end>=1){ const g=ghost(i); if(g.length>1){ el("polyline",{points:pts(g.map(q=>P(q[0],q[1],q[2]))),fill:"none",stroke:"#8a8f8c","stroke-width":2,"stroke-dasharray":"4 5",opacity:.7*op});
      const e=g[g.length-1], c=P(e[0],e[1],0); if(c) el("ellipse",{cx:c.x,cy:c.y,rx:6,ry:2.5,fill:"none",stroke:"#8a8f8c","stroke-width":1.5,opacity:.8*op}); } }
    if(CUR&&CUR.i===i){ const k=Math.min(40,Math.round(40*CUR.e)); ball={x:L[k][0],y:L[k][1],z:z3(i,CUR.e)}; } }
  // 错误打法的红叉
  V3.x.forEach((p,j)=>{ if(!p||!$("x"+j)||$("x"+j).style.opacity!=="1") return; const [x,y]=m(...p), c=P(x,y,0); if(!c) return;
    const r=Math.max(6,c.s*.25); el("path",{d:`M${c.x-r} ${c.y-r*.5} L${c.x+r} ${c.y+r*.5} M${c.x+r} ${c.y-r*.5} L${c.x-r} ${c.y+r*.5}`,stroke:"#E0301E","stroke-width":5,"stroke-linecap":"round"}); });
  items.push({y:0, fn:net, net:true});
  items.sort((a,b)=>behindNet ? b.y-a.y : a.y-b.y);   // 远的先画
  for(const it of items) it.fn();
  if(ball){ const g=P(ball.x,ball.y,0), b=P(ball.x,ball.y,ball.z); if(g&&b){ el("ellipse",{cx:g.x,cy:g.y,rx:5,ry:2,fill:"rgba(0,0,0,.35)"});
    el("circle",{cx:b.x,cy:b.y,r:Math.max(3.5,b.s*.09),fill:"#fff",stroke:"#555","stroke-width":1.2}); } }
  const hint=el("text",{x:220,y:578,"text-anchor":"middle","font-size":12,fill:"#2B2B2B",opacity:.55}); hint.textContent="拖动转着看 · 双指 / 滚轮缩放";
  raf=on?requestAnimationFrame(draw):0; }
function show(v){ on=v; try{ localStorage.setItem("book_3d",on?"on":"off"); }catch(e){}
  svg.style.display=on?"block":"none"; document.querySelector(".court>svg:not(#v3)").style.opacity=on?0:1; btn.textContent=on?"2D":"3D"; rst.hidden=!on;
  cancelAnimationFrame(raf); if(on) draw(); }
btn.onclick=()=>show(!on); rst.onclick=()=>{ yaw=0; pitch=.6; dist=15; };
const ptrs=new Map(); let pinch=0;
svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]); });
svg.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId); if(!p) return;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d0=Math.hypot(a[0]-b[0],a[1]-b[1]); ptrs.set(e.pointerId,[e.clientX,e.clientY]); const [c,d]=[...ptrs.values()], d1=Math.hypot(c[0]-d[0],c[1]-d[1]);
    if(d0>0) dist=Math.min(34,Math.max(8,dist*d0/d1)); return; }
  yaw-=(e.clientX-p[0])*.008; pitch=Math.min(1.5,Math.max(.08,pitch+(e.clientY-p[1])*.006)); ptrs.set(e.pointerId,[e.clientX,e.clientY]); });
for(const t of ["pointerup","pointercancel"]) svg.addEventListener(t,e=>ptrs.delete(e.pointerId));
svg.addEventListener("wheel",e=>{ e.preventDefault(); dist=Math.min(34,Math.max(8,dist*(1+e.deltaY*.001))); },{passive:false});
show(on);
})();
</script></body></html>
