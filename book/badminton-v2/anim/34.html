const KOUJUE="平高发得快又深，他退不到位，我就抢。", END_VOICE="这就是发平高逼他后退，我抢攻。平高发得快，他就退不到位。记住口诀：平高发得快又深，他退不到位，我就抢。", ICON={"play": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l10.5-6.5z\" fill=\"currentColor\" stroke=\"none\"/></svg>", "stop": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6.5\" y=\"6.5\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"currentColor\" stroke=\"none\"/></svg>", "next": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l8 6-8 6z\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M17.5 6v12\"/></svg>", "reset": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4.5 12a7.5 7.5 0 1 0 2.2-5.3\"/><path d=\"M4.5 4.5v4h4\"/></svg>", "sound": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9.5h3.5L12 5.5v13l-4.5-4H4z\" fill=\"currentColor\"/><path d=\"M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11\"/></svg>", "mute": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 9.5h3.5L12 5.5v13l-4.5-4H4z\" fill=\"currentColor\"/><path d=\"M16 9.5l5 5M21 9.5l-5 5\"/></svg>", "voice": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8.5\" r=\"3.5\"/><path d=\"M3 19.5c.8-3.3 3.2-5 6-5s5.2 1.7 6 5\"/><path d=\"M17.5 6.5a4 4 0 0 1 0 5M20 4.5a7 7 0 0 1 0 9\"/></svg>"};
const $=id=>document.getElementById(id); let k=0, busy=false, auto=false, halt=false, timer=null, pendingReset=false;
const POS={};
function setMood(who,m){ const el=$(who); if(!el) return; for(const g of el.querySelectorAll(".mood")) g.style.display=g.dataset.mood===m?"inline":"none"; }
function place(who,x,y){ POS[who]=[x,y]; $(who).setAttribute("transform",`translate(${x} ${y})`); }
/* 停止：halt 置上后，正在跑的动画直接跳到这一拍的结尾、朗读掐掉，然后停下 */
function along(d,ms,fn){ const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",d); const L=p.getTotalLength(), t0=performance.now();
  return new Promise(ok=>{ const step=t=>{ const f=halt?1:Math.min(1,(t-t0)/ms), e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2, q=p.getPointAtLength(L*e); fn(q,e);
    f<1?requestAnimationFrame(step):ok(); }; requestAnimationFrame(step); }); }
function moveTo(who,x,y,ms){ const [x0,y0]=POS[who]; if(Math.abs(x-x0)+Math.abs(y-y0)<1) return Promise.resolve(); return along(`M${x0} ${y0} L ${x} ${y}`,ms,q=>place(who,q.x,q.y)); }
function runAll(m){ return Promise.all(Object.entries(m||{}).map(([w,[x,y]])=>moveTo(w,x,y,650))); }
async function shot(i){ const s=$("s"+i), m=$("m"+i).firstChild, L=m.getTotalLength(), ball=$("ball");
  m.style.strokeDasharray=`${L} ${L}`; m.style.strokeDashoffset=L; s.setAttribute("mask",`url(#m${i})`); s.style.visibility="visible"; ball.style.opacity=1;
  const SL=s.getTotalLength();
  await along(s.getAttribute("d"), DUR[i], (q,e)=>{ m.style.strokeDashoffset=L*(1-e);
    const a=s.getPointAtLength(Math.max(0,SL*e-2)), b=s.getPointAtLength(Math.min(SL,SL*e+2)), deg=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI-90;  // 球托朝前
    ball.setAttribute("transform",`translate(${q.x} ${q.y}) rotate(${deg})`); });
  s.removeAttribute("mask"); if(ARROW[i]) s.setAttribute("marker-end",`url(#am${s.getAttribute("stroke").slice(1)})`); ball.style.opacity=0; }
function hideLine(i){ const s=$("s"+i); s.style.visibility="hidden"; s.removeAttribute("mask"); s.removeAttribute("marker-end"); }
/* 语音讲解：浏览器自带的中文朗读；一拍的动画和讲解都放完才进下一拍；朗读偶尔不回 onend，按字数兜底超时 */
const TTS=window.speechSynthesis||null;
let voiceOn=true; try{ voiceOn=localStorage.getItem("book_voice")!=="off"; }catch(e){}
const PREFER=[/Xiaoxiao/i,/Xiaoyi/i,/Google.*普通话|Google.*Mandarin/i,/Tingting|婷婷/i,/Lili|莉莉/i,/Shanshan|姗姗/i,/Yaoyao|Huihui/i];
let pick=""; try{ pick=localStorage.getItem("book_voice_name")||""; }catch(e){}
function rank(v){ const i=PREFER.findIndex(r=>r.test(v.name)); return (/^zh[-_]CN/i.test(v.lang)?0:100)+(i<0?50:i); }
function zhVoices(){ return (TTS?TTS.getVoices():[]).filter(v=>/^zh|^cmn/i.test(v.lang)).sort((a,b)=>rank(a)-rank(b)); }
function zhVoice(){ const vs=zhVoices(); return vs.find(v=>v.name===pick)||vs[0]||null; }
function speak(text){ return new Promise(ok=>{ if(!TTS||!voiceOn||!text||halt) return ok();
  const u=new SpeechSynthesisUtterance(text), v=zhVoice(); u.lang=v?v.lang:"zh-CN"; if(v) u.voice=v; u.rate=1.15; u.pitch=1.05;
  const t=setTimeout(ok, 2000+text.length*330); u.onend=u.onerror=()=>{ clearTimeout(t); ok(); }; TTS.speak(u); }); }
const VNAME={Tingting:"婷婷",Lili:"莉莉",Shanshan:"姗姗",Meijia:"美佳",Sinji:"善怡",Xiaoxiao:"晓晓",Xiaoyi:"晓伊",Yaoyao:"瑶瑶",Huihui:"慧慧",Kangkang:"康康",Yunxi:"云希"};
function vshort(v){ const m=Object.keys(VNAME).find(n=>v.name.includes(n)); return m?VNAME[m]:/Google/i.test(v.name)?"谷歌":v.name.replace(/^Microsoft |^Google /,"").slice(0,4); }
function showVoice(){ $("voice").innerHTML=`<span class="i">${ICON[voiceOn?"sound":"mute"]}</span><small>讲解${voiceOn?"开":"关"}</small>`;
  const vs=zhVoices(), cur=zhVoice(), sel=$("vsel"); $("vbtn").hidden=!vs.length; $("vname").textContent=cur?vshort(cur):"声音";
  sel.innerHTML=vs.map(v=>`<option value="${v.name}">${vshort(v)}（${v.name.replace(/^Microsoft |^Google /,"").replace(/ Online \(Natural\)/," 自然")} · ${v.lang}）</option>`).join("");
  if(cur) sel.value=cur.name;
  $("vnote").textContent=!TTS?"这个浏览器不支持朗读":(TTS.getVoices().length&&!vs.length?"没找到中文声音":""); }
$("vsel").onchange=e=>{ pick=e.target.value; showVoice(); try{ localStorage.setItem("book_voice_name",pick); }catch(err){} if(TTS){ TTS.cancel(); speak("你好，我来给你讲这条球路。"); } };
if(TTS) TTS.onvoiceschanged=showVoice; showVoice();
$("voice").onclick=()=>{ voiceOn=!voiceOn; try{ localStorage.setItem("book_voice",voiceOn?"on":"off"); }catch(e){} if(!voiceOn&&TTS) TTS.cancel(); showVoice(); };
function ui(){ const playing=auto&&(busy||timer!==null), p=$("play");
  const [ic,tx]=playing?["stop","停止"]:k>=BEATS.length?["reset","再播一次"]:k>0?["play","接着播"]:["play","播放"]; p.innerHTML=`<span class="i">${ICON[ic]}</span><small>${tx}</small>`; p.classList.toggle("playing",playing);
  $("next").disabled=busy||k>=BEATS.length; $("reset").disabled=k===0&&!busy; }
function stop(){ auto=false; if(timer!==null){ clearTimeout(timer); timer=null; } if(busy){ halt=true; if(TTS) TTS.cancel(); } ui(); }
async function beat(){ timer=null; if(busy||k>=BEATS.length) return; busy=true; ui(); const b=BEATS[k];
  $("say").innerHTML=`<b>第 ${k+1} 拍</b>　${b.say}`;
  let anim;
  if(SIDE){ for(const id of b.show) { const el=$(id); if(el) el.style.opacity=1; } anim=b.lines.reduce((p,i)=>p.then(()=>shot(i)),Promise.resolve()); }
  else{ for(const [w,m] of Object.entries(b.mood)) setMood(w,m);
    for(const g of document.querySelectorAll(".bub")) g.style.opacity=0; if(b.bubble) $("b"+k).style.opacity=1;
    anim=runAll(b.before).then(()=>shot(b.shot)).then(()=>{ if(b.hide) $("b"+k).style.opacity=0; return runAll(b.after); }); }
  await Promise.all([anim, speak(b.voice)]);
  k++; if(k===BEATS.length){ for(const p of document.querySelectorAll(".pill")){ const i=+p.dataset.i; p.classList.toggle("on",i<GOAL); p.classList.toggle("goal",i===GOAL); }
    await showWrong();
    $("say").innerHTML=`<b>记住口诀</b>　${KOUJUE}`; await speak(END_VOICE); }
  busy=false; halt=false; if(pendingReset){ pendingReset=false; reset(); return; }
  if(auto&&k<BEATS.length) timer=setTimeout(beat,500); else auto=false; ui(); }
/* 小心：对的球路淡下去、标「错误打法」，人走到出错时的位置，一句讲解配一个动作；演完换回对的球路。没写错误打法的页，只读「小心」 */
function clearWrong(){ for(let i=N_OK;i<N_LINES;i++) hideLine(i); WRONG.forEach((w,j)=>{ if($("x"+j)) $("x"+j).style.opacity=0; if($("wb"+j)) $("wb"+j).style.opacity=0; }); }
async function showWrong(){
  if(!WRONG.length){ $("badge").textContent="⚠ 小心"; $("badge").classList.add("on");
    for(const c of CARES){ $("say").innerHTML=`<b>小心</b>　${c}`; await speak("小心！"+c); if(!halt) await new Promise(r=>setTimeout(r,400)); }
    $("badge").classList.remove("on"); return; }
  const keep={op:[...POS.op], me:[...POS.me]}, moods={};
  for(const w of ["op","me"]){ const g=[...$(w).querySelectorAll(".mood")].find(g=>g.style.display!=="none"); moods[w]=g?g.dataset.mood:"smile"; }
  const bubs=[...document.querySelectorAll(".bub")].map(g=>[g,g.style.opacity]);
  $("badge").textContent="✕ 错误打法"; $("right").style.opacity=.15; for(const [g] of bubs) g.style.opacity=0; $("badge").classList.add("on");
  for(const [j,w] of WRONG.entries()){
    $("say").innerHTML=`<b>小心</b>　${w.say}`;
    if(w.clear) clearWrong();
    if(w.players) await runAll(w.players);
    for(const [who,m] of Object.entries(w.moods||{})) setMood(who,m);
    if(w.bubble) $("wb"+j).style.opacity=1;
    const ln=w.line==null?Promise.resolve():shot(w.line);
    await Promise.all([ln.then(()=>{ if(w.x) $("x"+j).style.opacity=1; }), speak(w.voice)]);
    if(!halt) await new Promise(r=>setTimeout(r,250));
  }
  clearWrong(); $("badge").classList.remove("on"); $("right").style.opacity=1;
  for(const w of ["op","me"]){ place(w,...keep[w]); setMood(w,moods[w]); } for(const [g,o] of bubs) g.style.opacity=o;
}
function reset(){ if(busy){ pendingReset=true; stop(); return; } stop(); if(TTS) TTS.cancel(); clearWrong(); $("badge").classList.remove("on"); if($("right")) $("right").style.opacity=1; k=0; auto=false;
  for(let i=0;i<N_OK;i++) hideLine(i);
  if(SIDE) for(const el of document.querySelectorAll("[id^=lb],[id^=pt]")) el.style.opacity=0;
  else{ for(const w of ["me","op"]){ setMood(w,"smile"); place(w,...START[w]); } for(const g of document.querySelectorAll(".bub")) g.style.opacity=0; }
  for(const p of document.querySelectorAll(".pill")) p.className="pill"; $("say").textContent="点「播放」，一拍一拍看。"; ui(); }
$("play").onclick=()=>{ if(auto){ stop(); return; } if(k>=BEATS.length) reset(); auto=true; beat(); };
$("next").onclick=()=>{ auto=false; beat(); }; $("reset").onclick=reset;
document.addEventListener("touchstart",()=>{},{passive:true});  // iOS Safari 要有触摸监听，:active 按下效果才出来
if(!SIDE) for(const w of ["me","op"]) place(w,...START[w]); ui();
</script></body></html>
